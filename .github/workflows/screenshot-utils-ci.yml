name: Screenshot Utils CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  screenshot-utils:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare output folders
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/screenshots/avalonia"
          mkdir -p "$GITHUB_WORKSPACE/out/screenshots/wpf"

      - name: Run Avalonia screenshot util (verbose)
        run: |
          ./Utils/AvaloniaSampleScreenshot/run.sh \
            --verbose \
            --output-dir "$GITHUB_WORKSPACE/out/screenshots/avalonia"

      - name: Run WPF screenshot util (verbose)
        run: |
          ./Utils/WpfSampleScreenshot/run.sh \
            --verbose \
            --output-dir "$GITHUB_WORKSPACE/out/screenshots/wpf"

      - name: Pack screenshot output directory
        if: always()
        run: |
          tar -C "$GITHUB_WORKSPACE/out" -czf "$GITHUB_WORKSPACE/out/screenshot-output.tar.gz" screenshots
          ls -lah "$GITHUB_WORKSPACE/out"

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-output
          path: |
            ${{ github.workspace }}/out/screenshot-output.tar.gz
          if-no-files-found: error
